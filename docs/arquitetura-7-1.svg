<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#111827">Aplicativo da Livraria — Arquitetura Monolítica Modular</text>

  <!-- Usuários -->
  <g fill="none" stroke="#1f2937" stroke-width="3">
    <circle cx="140" cy="300" r="26"/>
    <path d="M95,375 Q95,335 140,335 Q185,335 185,375"/>
    <circle cx="140" cy="510" r="26"/>
    <path d="M95,585 Q95,545 140,545 Q185,545 185,585"/>
  </g>
  <text x="140" y="410" text-anchor="middle" font-size="20" fill="#111827">Cliente</text>
  <text x="140" y="434" text-anchor="middle" font-size="16" fill="#4b5563">(navegador / celular)</text>
  <text x="140" y="620" text-anchor="middle" font-size="20" fill="#111827">Funcionário</text>
  <text x="140" y="644" text-anchor="middle" font-size="16" fill="#4b5563">(balcão da loja)</text>
  <line x1="200" y1="360" x2="335" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#seta)"/>
  <line x1="200" y1="570" x2="335" y2="470" stroke="#1f2937" stroke-width="3" marker-end="url(#seta)"/>
  <text x="270" y="440" text-anchor="middle" font-size="18" fill="#111827">HTTP</text>

  <!-- Aplicação -->
