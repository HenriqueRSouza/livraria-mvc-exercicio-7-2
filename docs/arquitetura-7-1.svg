      <rect x="12" y="215" width="140" height="80" rx="6" fill="#fde68a" stroke="#92400e"/><text x="82" y="262">UI</text>
      <rect x="12" y="335" width="140" height="80" rx="6" fill="#bbf7d0" stroke="#166534"/><text x="82" y="370">Lógica de</text><text x="82" y="394">negócio</text>
      <rect x="12" y="455" width="140" height="80" rx="6" fill="#bfdbfe" stroke="#1e40af"/><text x="82" y="490">Acesso a</text><text x="82" y="514">dados</text>
      <line x1="82" y1="295" x2="82" y2="333" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
      <line x1="82" y1="415" x2="82" y2="453" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
      <text x="82" y="580" font-size="16" fill="#374151">reservar, retirar,</text><text x="82" y="602" font-size="16" fill="#374151">comprar e</text><text x="82" y="624" font-size="16" fill="#374151">pontos</text>
    </g>
    <g transform="translate(1056,0)">
      <rect y="160" width="164" height="530" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
      <text x="82" y="192" font-weight="bold">Comunicação</text>
      <rect x="12" y="215" width="140" height="80" rx="6" fill="#fde68a" stroke="#92400e"/><text x="82" y="262">UI</text>
      <rect x="12" y="335" width="140" height="80" rx="6" fill="#bbf7d0" stroke="#166534"/><text x="82" y="370">Lógica de</text><text x="82" y="394">negócio</text>
      <rect x="12" y="455" width="140" height="80" rx="6" fill="#bfdbfe" stroke="#1e40af"/><text x="82" y="490">Acesso a</text><text x="82" y="514">dados</text>
      <line x1="82" y1="295" x2="82" y2="333" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
      <line x1="82" y1="415" x2="82" y2="453" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
