  <!-- Banco -->
  <line x1="1240" y1="430" x2="1315" y2="430" stroke="#1f2937" stroke-width="3" marker-end="url(#seta)"/>
  <g stroke="#1f2937" stroke-width="3" fill="#f3f4f6">
    <path d="M1320,250 L1320,610 A120,30 0 0 0 1560,610 L1560,250"/>
    <ellipse cx="1440" cy="250" rx="120" ry="30"/>
  </g>
  <text x="1440" y="320" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Banco de dados</text>
  <text x="1440" y="346" text-anchor="middle" font-size="17" fill="#374151">SQLite (livraria.db)</text>
  <g font-size="16" fill="#374151" text-anchor="middle">
    <text x="1440" y="392">livros · edições</text>
    <text x="1440" y="418">avaliações · promoções</text>
    <text x="1440" y="444">lojas · estoques</text>
    <text x="1440" y="470">clientes · favoritos</text>
    <text x="1440" y="496">reservas · compras</text>
    <text x="1440" y="522">alertas · notificações</text>
  </g>

  <!-- Dependências externas -->
  <g font-size="18" text-anchor="middle" fill="#374151">
    <rect x="420" y="770" width="300" height="70" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="570" y="800">Pagamento (Pix/cartão)</text><text x="570" y="824" font-size="15">dependência externa — simulada</text>
    <rect x="860" y="770" width="300" height="70" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1010" y="800">Email / Push / SMS</text><text x="1010" y="824" font-size="15">dependência externa — simulada</text>
  </g>
  <line x1="570" y1="712" x2="570" y2="766" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/>
  <line x1="1010" y1="712" x2="1010" y2="766" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/>
</svg>
