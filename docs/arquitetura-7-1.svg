      <rect x="12" y="455" width="140" height="80" rx="6" fill="#bfdbfe" stroke="#1e40af"/><text x="82" y="490">Acesso a</text><text x="82" y="514">dados</text>
      <line x1="82" y1="295" x2="82" y2="333" stroke="#1f2937" stroke-width="2" marker-end="url(#seta)"/>
