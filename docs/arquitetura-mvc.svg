<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#111827">Livraria — Arquitetura MVC</text>

  <!-- Usuário -->
  <g fill="#fed7aa" stroke="#c2410c" stroke-width="3">
    <circle cx="180" cy="205" r="42"/>
    <path d="M110,330 Q110,260 180,260 Q250,260 250,330 Z" fill="#1e40af" stroke="#1e3a8a"/>
  </g>
  <text x="180" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Usuário</text>
  <line x1="265" y1="240" x2="545" y2="240" stroke="#111827" stroke-width="3" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="405" y="200" text-anchor="middle" font-size="18" fill="#4b5563">usa as páginas</text>
  <text x="405" y="222" text-anchor="middle" font-size="18" fill="#4b5563">(formulários HTML)</text>

  <!-- View -->
  <rect x="550" y="170" width="340" height="130" rx="26" fill="#ffffff" stroke="#facc15" stroke-width="5"/>
  <text x="720" y="228" text-anchor="middle" font-size="30" font-weight="bold" fill="#111827">VIEW</text>
  <text x="720" y="262" text-anchor="middle" font-size="18" fill="#374151">livraria/views/templates/*.html</text>

  <!-- Controller -->
  <rect x="520" y="420" width="400" height="130" rx="26" fill="#ffffff" stroke="#4ade80" stroke-width="5"/>
  <text x="720" y="478" text-anchor="middle" font-size="30" font-weight="bold" fill="#111827">CONTROLLER</text>
  <text x="720" y="512" text-anchor="middle" font-size="18" fill="#374151">livraria/controllers/*.py (rotas Flask)</text>

  <!-- Model -->
  <rect x="550" y="670" width="340" height="130" rx="26" fill="#ffffff" stroke="#6366f1" stroke-width="5"/>
  <text x="720" y="728" text-anchor="middle" font-size="30" font-weight="bold" fill="#111827">MODEL</text>
  <text x="720" y="762" text-anchor="middle" font-size="18" fill="#374151">livraria/models/*.py</text>

  <!-- setas verticais -->
  <line x1="680" y1="302" x2="680" y2="416" stroke="#111827" stroke-width="4" marker-end="url(#seta)"/>
  <line x1="760" y1="418" x2="760" y2="304" stroke="#111827" stroke-width="4" marker-end="url(#seta)"/>
  <text x="665" y="355" text-anchor="end" font-size="18" fill="#4b5563">requisição</text>
  <text x="665" y="377" text-anchor="end" font-size="18" fill="#4b5563">(GET / POST)</text>
  <text x="775" y="355" font-size="18" fill="#4b5563">render_template</text>
  <text x="775" y="377" font-size="18" fill="#4b5563">com os dados</text>
  <line x1="680" y1="552" x2="680" y2="666" stroke="#111827" stroke-width="4" marker-end="url(#seta)"/>
  <line x1="760" y1="668" x2="760" y2="554" stroke="#111827" stroke-width="4" marker-end="url(#seta)"/>
  <text x="665" y="605" text-anchor="end" font-size="18" fill="#4b5563">pede dados /</text>
  <text x="665" y="627" text-anchor="end" font-size="18" fill="#4b5563">executa a ação</text>
  <text x="775" y="605" font-size="18" fill="#4b5563">devolve os</text>
  <text x="775" y="627" font-size="18" fill="#4b5563">dados</text>

  <!-- Banco -->
  <line x1="895" y1="720" x2="1075" y2="720" stroke="#111827" stroke-width="4" marker-end="url(#seta)"/>
  <line x1="1075" y1="755" x2="895" y2="755" stroke="#111827" stroke-width="4" marker-end="url(#seta)"/>
  <text x="985" y="705" text-anchor="middle" font-size="17" fill="#4b5563">SQL</text>
  <text x="985" y="785" text-anchor="middle" font-size="17" fill="#4b5563">resultado</text>
  <g stroke="#b91c1c" stroke-width="3" fill="#f87171">
    <path d="M1090,660 L1090,800 A70,20 0 0 0 1230,800 L1230,660"/>
    <ellipse cx="1160" cy="660" rx="70" ry="20"/>
  </g>
  <text x="1160" y="850" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">livraria.db (SQLite)</text>

  <!-- Legenda -->
  <g font-size="19" fill="#111827">
    <text x="1030" y="190" font-weight="bold" font-size="22">O que fica em cada parte</text>
    <text x="1030" y="232"><tspan font-weight="bold">View:</tspan> páginas HTML (catálogo, livro,</text>
    <text x="1030" y="258">lojas, entrada, minha área)</text>
    <text x="1030" y="300"><tspan font-weight="bold">Controller:</tspan> catalogo, lojas, clientes,</text>
    <text x="1030" y="326">pedidos e comunicacao</text>
    <text x="1030" y="368"><tspan font-weight="bold">Model:</tspan> regras (preço, estoque,</text>
    <text x="1030" y="394">reserva, pontos) e acesso ao banco</text>
  </g>
</svg>
